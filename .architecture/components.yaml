version: 1

owners:
  core_maintainers:
    github:
      - "@e3742526"

components:
  - id: desktop.ipc_contract
    owners: [core_maintainers]
    paths:
      - ui/desktop/src/ipc
      - ui/desktop/src/preload.ts
      - ui/desktop/src/main.ts
    responsibilities:
      - define channel names and payload types shared by preload and main
      - keep renderer-facing privileged API surface minimal
    notes:
      - preload must not expose dead or unhandled privileged methods

  - id: compatibility.goose_catalog_adapter
    owners: [core_maintainers]
    paths:
      - documentation/GOOSE_COMPATIBILITY.md
      - documentation/scripts/goose-compat.js
    responsibilities:
      - preserve deterministic Goose catalog fallback behavior
      - keep provenance and normalization explicit

  - id: shell.consumer_composition
    owners: [core_maintainers]
    paths:
      - ui/desktop/scripts
      - ui/desktop/forge.config.ts
      - ui/desktop/vite.shell.renderer.config.mts
    responsibilities:
      - resolve trusted consumer manifests and renderer entries
      - keep Electron host main and preload entries immutable across consumers
      - reject consumer-supplied privilege, process, and path authority

  - id: shell.application_runtime
    owners: [core_maintainers]
    paths:
      - ui/desktop/src/shell
    responsibilities:
      - own the authenticated ACP connection in Electron main
      - expose only bounded application capabilities to consumer renderers
      - fence session, prompt, and interaction lifecycle state

  - id: shell.domain_adapter
    owners: [core_maintainers]
    paths:
      - crates/gosling/src/acp/shell.rs
      - crates/gosling/src/acp/server/shell_handlers.rs
      - crates/gosling-cli/src/cli.rs
      - crates/gosling-sdk-types/src/shell.rs
    responsibilities:
      - negotiate and supervise registered out-of-process domain adapters
      - keep domain authorization and confirmation in the Rust server
      - prevent descriptor-only domain capability from reaching ready state
